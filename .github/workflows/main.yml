name: Build NineCrowns

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'
          cache-disabled: true

      - name: Find project folder
        run: |
          PROJECT_DIR=$(dirname "$(find . -maxdepth 4 -name settings.gradle -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found in: $PROJECT_DIR"

      - name: Build NineCrowns
        run: gradle -p "$PROJECT_DIR" build

      - name: Verify JAR
        run: |
          JAR=$(find . -path "*/build/libs/*.jar" ! -name "*sources*" | head -n 1)
          echo "Checking: $JAR"
          test -n "$JAR"
          jar tf "$JAR" | grep "fabric.mod.json"
          jar tf "$JAR" | grep "NineCrowns.class"
          jar tf "$JAR" | grep "ModItems.class"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: NineCrowns-26.1-v1.2.1
          path: |
            **/build/libs/*.jar
            !**/build/libs/*sources*.jar
