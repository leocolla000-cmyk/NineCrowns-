name: Build NineCrowns

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'
          cache-disabled: true

      - name: Build NineCrowns
        run: gradle -p NineCrowns-26.1-v1.2.1 build

      - name: Verify JAR contents
        run: |
          JAR=$(find NineCrowns-26.1-v1.2.1/build/libs -name "*.jar" ! -name "*sources*" | head -n 1)
          echo "Checking $JAR"
          jar tf "$JAR" | grep "fabric.mod.json"
          jar tf "$JAR" | grep "it/lia/ninecrowns/NineCrowns.class"
          jar tf "$JAR" | grep "it/lia/ninecrowns/ModItems.class"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: NineCrowns-26.1-v1.2.1
          path: NineCrowns-26.1-v1.2.1/build/libs/*.jar
